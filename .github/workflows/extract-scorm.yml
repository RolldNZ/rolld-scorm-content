name: Extract SCORM Zip

on:
  push:
    paths:
      - '_zips/**'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Extract new zips
        run: |
          for ZIP in _zips/*.zip; do
            SLUG=$(basename "$ZIP" .zip)
            if [ ! -d "$SLUG" ]; then
              echo "Extracting $ZIP to $SLUG/"
              mkdir -p "$SLUG"
              unzip -o "$ZIP" -d "$SLUG"
            else
              echo "Skipping $SLUG (already extracted)"
            fi
          done

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --staged --quiet || git commit -m "Auto-extract SCORM zips"
          git push
