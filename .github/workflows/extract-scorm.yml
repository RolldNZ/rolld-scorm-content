name: Extract SCORM Zip

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Course slug'
        required: true
      title:
        description: 'Course title'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Extract zip to folder
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          ZIP_PATH="_zips/${SLUG}.zip"
          echo "Extracting ${ZIP_PATH} to ${SLUG}/"
          mkdir -p "${SLUG}"
          unzip -o "${ZIP_PATH}" -d "${SLUG}"
          echo "Done"

      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Extract SCORM: ${{ github.event.inputs.title }}" || echo "Nothing to commit"
          git push
