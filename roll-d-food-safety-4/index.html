<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="format-detection" content="telephone=no"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/><title>Loading your lesson...</title><script defer="defer" src="runtime.e5bd6c7e9e58dfdd.js"></script><script defer="defer" src="modules.5f6d919fedefb926.js"></script><script defer="defer" src="scorm.2aa5f200ece6542d.js"></script><script defer="defer" src="vendors.9d8f217301be500e.js"></script><script defer="defer" src="app.11299d8438b24921.js"></script><link href="modules.a5b0990ec50f29b5.css" rel="stylesheet"><link href="app.19fd4bf4acfdcb7e.css" rel="stylesheet">
  <script>
    (function() {
      var cmiData = {};
      var STORAGE_KEY = "scorm_data_" + (new URLSearchParams(window.location.search).get("courseId") || "default");
      try { var s = localStorage.getItem(STORAGE_KEY); if (s) { cmiData = JSON.parse(s); cmiData["cmi.core.entry"] = "resume"; } } catch(e) {}
      function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cmiData)); } catch(e) {} }
      function sync() { try { window.parent.postMessage({ type: "scorm_update", data: cmiData }, "*"); } catch(e) {} }
      window.API = {
        LMSInitialize: function() { sync(); return "true"; },
        LMSFinish: function() { save(); sync(); return "true"; },
        LMSGetValue: function(e) { return cmiData[e] !== undefined ? String(cmiData[e]) : ""; },
        LMSSetValue: function(e, v) { cmiData[e] = v; save(); sync(); return "true"; },
        LMSCommit: function() { save(); sync(); return "true"; },
        LMSGetLastError: function() { return "0"; },
        LMSGetErrorString: function() { return "No error"; },
        LMSGetDiagnostic: function() { return ""; }
      };
      window.CommitData = function() { save(); sync(); };
      window.ConcedeControl = function() {};
      window.CreateResponseIdentifier = function(a, b) { return a || b || ""; };
      window.Finish = function() { window.CommitData(); };
      window.GetDataChunk = function() { return JSON.stringify(cmiData); };
      window.GetStatus = function() { return cmiData["cmi.core.lesson_status"] || "incomplete"; };
      window.MatchingResponse = function() {};
      window.RecordFillInInteraction = function() {};
      window.RecordMatchingInteraction = function() {};
      window.RecordMultipleChoiceInteraction = function() {};
      window.ResetStatus = function() { cmiData["cmi.core.lesson_status"] = "incomplete"; };
      window.SetBookmark = function(url) { cmiData["cmi.core.lesson_location"] = url; window.CommitData(); };
      window.SetDataChunk = function(data) { try { Object.assign(cmiData, JSON.parse(data)); } catch(e) {} window.CommitData(); };
      window.SetFailed = function() { cmiData["cmi.core.lesson_status"] = "failed"; window.CommitData(); };
      window.SetPassed = function() { cmiData["cmi.core.lesson_status"] = "passed"; window.CommitData(); };
      window.SetReachedEnd = function() { if (!cmiData["cmi.core.lesson_status"] || cmiData["cmi.core.lesson_status"] === "incomplete" || cmiData["cmi.core.lesson_status"] === "not attempted") { cmiData["cmi.core.lesson_status"] = "completed"; } window.CommitData(); };
      window.SetScore = function(s) { cmiData["cmi.core.score.raw"] = s; window.CommitData(); };
      window.WriteToDebug = function(msg) { console.log("SCORM:", msg); };
      window.LESSON_STATUS_PASSED = "passed";
    })();
  </script>
</head><body><script defer="defer">document.addEventListener("DOMContentLoaded", function () {
        window.Application.initialize("scorm");
      });</script></body></html>
